name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install system tools for reference-doc extraction tests
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-docx
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build client bundle
        run: node build.js
      - name: Run tests
        run: node test/run-all.mjs
